<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quality Games Hub</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 0.6s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <header class="w-full px-4 py-3 glass-panel sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goHome()">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-sky-500 to-emerald-400 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-award text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-white">Quality<span class="gradient-text">Games</span></h1>
                <p class="text-[10px] text-slate-400 font-medium">Fabio Simone</p>
            </div>
        </div>
        <div id="header-room-badge" class="hidden px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-xs font-bold flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span>ROOM: <span id="header-room-code">------</span></span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-6xl w-full mx-auto">

        <section id="view-home" class="w-full max-w-4xl space-y-8 py-4">
            <div class="text-center space-y-3">
                <h2 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">Sfida il tuo <span class="gradient-text">Team Qualità</span></h2>
                <p class="text-slate-400 max-w-xl mx-auto text-sm">Powered by Supabase Real-Time + Polling Fallback</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="app.startHostFlow()" class="glass-panel p-8 rounded-2xl cursor-pointer group hover:border-indigo-500/50 transition-all">
                    <div class="space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-2xl">
                            <i class="fa-solid fa-desktop"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white">Modalità HOST</h3>
                    </div>
                </div>
                <div onclick="app.startPlayerFlow()" class="glass-panel p-8 rounded-2xl cursor-pointer group hover:border-emerald-500/50 transition-all">
                    <div class="space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white">Modalità GIOCATORE</h3>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-host-lobby" class="hidden w-full max-w-4xl space-y-6">
            <div class="flex flex-col md:flex-row gap-6 items-stretch">
                <div class="glass-panel p-6 rounded-2xl md:w-5/12 flex flex-col items-center justify-center text-center space-y-4">
                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase">Codice Stanza</span>
                        <div id="lobby-room-code-display" class="text-4xl font-black text-indigo-400 tracking-wider my-1 font-mono">---</div>
                    </div>
                    <div class="p-3 bg-white rounded-2xl" id="qrcode-container" style="width: 190px; height: 190px;"></div>
                </div>

                <div class="glass-panel p-6 rounded-2xl md:w-7/12 flex flex-col justify-between space-y-6">
                    <div>
                        <h3 class="text-xl font-bold text-white mb-4">Giocatori: <span id="player-count-badge" class="text-indigo-400">0</span></h3>
                        <div id="lobby-players-list" class="space-y-2 max-h-52 overflow-y-auto"></div>
                    </div>
                    <button id="btn-start-game" onclick="app.hostStartGame()" disabled class="w-full py-4 rounded-xl font-black text-lg bg-slate-800 text-slate-500 cursor-not-allowed">
                        Inizia Gioco (0 pronti)
                    </button>
                </div>
            </div>
        </section>

        <section id="view-host-game" class="hidden w-full max-w-4xl space-y-6">
            <div class="glass-panel p-6 rounded-2xl flex justify-between items-center">
                <div>
                    <span id="host-q-category" class="px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold border border-indigo-500/30">Categoria</span>
                    <h2 id="host-q-text" class="text-2xl font-extrabold text-white leading-snug mt-2">Testo domanda...</h2>
                </div>
                <div class="w-20 h-20 rounded-full border-4 border-indigo-500 flex items-center justify-center bg-slate-900/80">
                    <span id="host-timer-seconds" class="text-3xl font-black text-white">30</span>
                </div>
            </div>
            <div id="host-answers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div class="glass-panel p-4 rounded-2xl flex justify-between items-center">
                <div class="text-sm text-slate-400">
                    Risposte: <strong id="host-answers-submitted-count" class="text-indigo-400">0</strong>/<span id="host-total-players-count">0</span>
                </div>
                <button id="host-show-answer-btn" onclick="app.hostShowAnswer()" class="px-4 py-2.5 rounded-xl font-bold bg-emerald-600 text-white">Mostra Risposta</button>
            </div>
        </section>

        <section id="view-player-join" class="hidden w-full max-w-md space-y-6">
            <div class="glass-panel p-8 rounded-3xl space-y-6 text-center border-t-4 border-emerald-500">
                <h2 class="text-2xl font-black text-white">Unisciti alla Sfida</h2>
                <form onsubmit="app.playerSubmitJoin(event)" class="space-y-4">
                    <input type="text" id="join-room-code" required placeholder="Es. qg-8492" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-center text-xl tracking-wider font-mono focus:outline-none">
                    <input type="text" id="join-nickname" required placeholder="Il tuo nome" maxlength="20" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none">
                    <button type="submit" class="w-full py-4 rounded-xl font-black text-lg bg-gradient-to-r from-emerald-500 to-teal-600 text-white">Connetti e Gioca</button>
                </form>
            </div>
        </section>

        <section id="view-player-game" class="hidden w-full max-w-md space-y-4">
            <div class="glass-panel p-4 rounded-2xl flex justify-between items-center">
                <div id="player-disp-name" class="text-sm font-bold text-white">Giocatore</div>
                <div id="player-disp-score" class="text-xs text-indigo-400 font-mono font-bold">0 PUNTI</div>
            </div>
            <div id="player-status-banner" class="glass-card p-4 rounded-2xl text-center">
                <p id="player-status-text" class="text-sm font-bold text-slate-400">In Attesa dell'Host...</p>
            </div>
            <div id="player-buttons-grid" class="grid grid-cols-1 gap-3">
                <button onclick="app.playerSubmitAnswer(0)" class="w-full p-5 rounded-2xl bg-rose-600 text-white font-bold text-left flex items-center space-x-4">
                    <span class="w-10 h-10 rounded-xl bg-black/20 flex items-center justify-center text-lg font-black">A</span>
                    <span id="player-ans-0">Opzione A</span>
                </button>
                <button onclick="app.playerSubmitAnswer(1)" class="w-full p-5 rounded-2xl bg-sky-600 text-white font-bold text-left flex items-center space-x-4">
                    <span class="w-10 h-10 rounded-xl bg-black/20 flex items-center justify-center text-lg font-black">B</span>
                    <span id="player-ans-1">Opzione B</span>
                </button>
                <button onclick="app.playerSubmitAnswer(2)" class="w-full p-5 rounded-2xl bg-amber-500 text-slate-950 font-bold text-left flex items-center space-x-4">
                    <span class="w-10 h-10 rounded-xl bg-black/10 flex items-center justify-center text-lg font-black">C</span>
                    <span id="player-ans-2">Opzione C</span>
                </button>
                <button onclick="app.playerSubmitAnswer(3)" class="w-full p-5 rounded-2xl bg-emerald-600 text-white font-bold text-left flex items-center space-x-4">
                    <span class="w-10 h-10 rounded-xl bg-black/20 flex items-center justify-center text-lg font-black">D</span>
                    <span id="player-ans-3">Opzione D</span>
                </button>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://qcwlyupyscvgieewyifk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MkwR5br0dO-hVHVlfTtWsw_fQI7lDEB';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const DEFAULT_QUESTIONS = [
            { id: 1, category: "Incoming Inspection", question: "Nel piano di campionamento ISO 2859-1 (AQL), cosa indica un AQL dell'1.0%?", options: ["Il 1% del lotto viene sempre scartato", "Il livello di qualità accettabile massimo medio di non conformità", "Che si controlla solo 1 pezzo ogni 100 prodotti", "Un errore massimo tollerato del 10%"], correct: 1, timer: 30 },
            { id: 2, category: "FAI", question: "Qual è il fine principale del FAI report?", options: ["Sostituire i controlli finali", "Verificare che il processo sia capace di produrre parti conformi", "Calcolare il costo", "Certificare l'imballo"], correct: 1, timer: 30 }
        ];

        class App {
            constructor() {
                this.role = null;
                this.roomCode = null;
                this.playerData = null;
                this.questions = [...DEFAULT_QUESTIONS];
                this.currentQuestionIdx = 0;
                this.players = {};
                this.gameState = 'LOBBY';
                this.myScore = 0;
                this.mySelectedAnswer = null;
                this.timeLeft = 0;
                this.playerPollInterval = null;
            }

            showView(id) {
                document.querySelectorAll('section[id^="view-"]').forEach(el => el.classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            }

            goHome() {
                clearInterval(this.playerPollInterval);
                location.reload();
            }

            async startHostFlow() {
                this.role = 'host';
                const randomId = 'qg-' + Math.floor(1000 + Math.random() * 9000);
                this.roomCode = randomId;

                const { error } = await supabase.from('rooms').insert([{
                    id: randomId,
                    host_id: 'host-' + Date.now(),
                    game_state: 'LOBBY',
                    current_question_idx: 0
                }]);

                if (error) {
                    alert('Errore: ' + error.message);
                    return;
                }

                document.getElementById('lobby-room-code-display').innerText = randomId;
                document.getElementById('header-room-code').innerText = randomId;
                document.getElementById('header-room-badge').classList.remove('hidden');

                const joinUrl = `${window.location.origin}${window.location.pathname}?room=${randomId}`;
                new QRCode(document.getElementById('qrcode-container'), {
                    text: joinUrl,
                    width: 170,
                    height: 170,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                });

                // Polling della lobby ogni 1 secondo
                setInterval(() => this.updateHostLobbyUI(), 1000);
                this.updateHostLobbyUI();
                this.showView('view-host-lobby');
            }

            async updateHostLobbyUI() {
                const { data: players } = await supabase.from('players').select('*').eq('room_id', this.roomCode);
                const pCount = players ? players.length : 0;
                
                document.getElementById('player-count-badge').innerText = pCount;
                document.getElementById('start-btn-players-count').innerText = pCount;

                const listEl = document.getElementById('lobby-players-list');
                const startBtn = document.getElementById('btn-start-game');

                if (pCount > 0) {
                    startBtn.disabled = false;
                    startBtn.className = 'w-full py-4 rounded-xl font-black text-lg bg-indigo-600 hover:bg-indigo-500 text-white';
                    listEl.innerHTML = players.map(p => `
                        <div class="glass-card px-3 py-2 rounded-xl flex items-center space-x-2">
                            <i class="fa-solid fa-user text-emerald-400 text-xs"></i>
                            <span class="text-xs font-bold text-white">${p.name}</span>
                        </div>
                    `).join('');
                } else {
                    startBtn.disabled = true;
                    startBtn.className = 'w-full py-4 rounded-xl font-black text-lg bg-slate-800 text-slate-500 cursor-not-allowed';
                    listEl.innerHTML = '<div class="text-center text-slate-500 text-sm italic py-4">In attesa di giocatori...</div>';
                }

                this.players = {};
                if (players) players.forEach(p => this.players[p.id] = p);
            }

            async hostStartGame() {
                if (Object.keys(this.players).length === 0) {
                    alert('Nessun giocatore!');
                    return;
                }

                this.currentQuestionIdx = 0;
                this.gameState = 'GAME';

                // ✅ IMPORTANTE: Aggiorna il database PRIMA di tutto
                await supabase.from('rooms').update({ 
                    game_state: 'GAME',
                    current_question_idx: 0
                }).eq('id', this.roomCode);

                console.log('[HOST] Game state salvato nel database');
                
                this.loadHostQuestion(0);
                this.showView('view-host-game');
            }

            loadHostQuestion(idx) {
                if (idx >= this.questions.length) return;
                
                const q = this.questions[idx];
                document.getElementById('host-q-category').innerText = q.category;
                document.getElementById('host-q-text').innerText = q.question;
                document.getElementById('host-total-players-count').innerText = Object.keys(this.players).length;

                const grid = document.getElementById('host-answers-grid');
                const colors = ['bg-rose-950/40 border-rose-600/40', 'bg-sky-950/40 border-sky-600/40', 'bg-amber-950/40 border-amber-600/40', 'bg-emerald-950/40 border-emerald-600/40'];
                const badges = ['A', 'B', 'C', 'D'];

                grid.innerHTML = q.options.map((opt, i) => `
                    <div id="host-ans-card-${i}" class="glass-card p-5 rounded-2xl border-2 ${colors[i]} flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-lg bg-slate-900/80 flex items-center justify-center font-black">${badges[i]}</span>
                        <span class="font-bold">${opt}</span>
                    </div>
                `).join('');

                document.getElementById('host-show-answer-btn').classList.remove('hidden');
                this.startHostTimer(q.timer);
            }

            startHostTimer(seconds) {
                clearInterval(this.timerInterval);
                this.timeLeft = seconds;
                const timerEl = document.getElementById('host-timer-seconds');
                
                timerEl.innerText = this.timeLeft;
                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    timerEl.innerText = this.timeLeft;
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.hostShowAnswer();
                    }
                }, 1000);
            }

            hostShowAnswer() {
                const q = this.questions[this.currentQuestionIdx];
                q.options.forEach((_, i) => {
                    const card = document.getElementById(`host-ans-card-${i}`);
                    if (i === q.correct) {
                        card.className = 'glass-card p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-600/30';
                    } else {
                        card.classList.add('opacity-40');
                    }
                });
            }

            startPlayerFlow() {
                this.role = 'player';
                const urlParams = new URLSearchParams(window.location.search);
                const roomParam = urlParams.get('room');
                if (roomParam) {
                    document.getElementById('join-room-code').value = roomParam;
                }
                this.showView('view-player-join');
            }

            async playerSubmitJoin(e) {
                e.preventDefault();
                const code = document.getElementById('join-room-code').value.trim();
                const name = document.getElementById('join-nickname').value.trim();

                const { data: room } = await supabase.from('rooms').select('*').eq('id', code).single();
                if (!room) {
                    alert('Stanza non trovata!');
                    return;
                }

                this.roomCode = code;
                const playerId = 'player-' + Math.random().toString(36).substr(2, 9);

                await supabase.from('players').insert([{
                    id: playerId,
                    room_id: code,
                    name: name,
                    mode: 'individual',
                    score: 0
                }]);

                this.playerData = { id: playerId, name, score: 0 };
                document.getElementById('player-disp-name').innerText = name;
                document.getElementById('header-room-code').innerText = code;
                document.getElementById('header-room-badge').classList.remove('hidden');

                this.showView('view-player-game');

                // ✅ POLLING per controllare lo stato del gioco
                this.playerPollInterval = setInterval(() => this.checkGameState(), 500);
                this.checkGameState();
            }

            async checkGameState() {
                const { data: room } = await supabase.from('rooms').select('*').eq('id', this.roomCode).single();
                if (!room) return;

                console.log('[PLAYER] Game state:', room.game_state, 'Current idx:', room.current_question_idx);

                if (room.game_state === 'GAME') {
                    clearInterval(this.playerPollInterval);
                    this.loadPlayerQuestion(room.current_question_idx);
                }
            }

            loadPlayerQuestion(idx) {
                if (idx >= this.questions.length) return;
                
                const q = this.questions[idx];
                this.mySelectedAnswer = null;
                
                document.getElementById('player-ans-0').innerText = q.options[0];
                document.getElementById('player-ans-1').innerText = q.options[1];
                document.getElementById('player-ans-2').innerText = q.options[2];
                document.getElementById('player-ans-3').innerText = q.options[3];

                document.getElementById('player-status-text').innerText = 'Scegli la Risposta!';

                const btns = document.querySelectorAll('#player-buttons-grid button');
                btns.forEach(btn => btn.disabled = false);
            }

            async playerSubmitAnswer(idx) {
                if (this.mySelectedAnswer !== null) return;
                this.mySelectedAnswer = idx;

                const q = this.questions[this.currentQuestionIdx];
                const isCorrect = idx === q.correct;
                
                if (isCorrect) {
                    this.myScore += 500;
                    document.getElementById('player-status-text').innerText = 'Esatto! 🎉';
                }

                document.getElementById('player-disp-score').innerText = `${this.myScore} PUNTI`;
                await supabase.from('players').update({ score: this.myScore }).eq('id', this.playerData.id);

                const btns = document.querySelectorAll('#player-buttons-grid button');
                btns.forEach((btn, i) => btn.disabled = true);
            }
        }

        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new App();
        });
    </script>
</body>
</html>
