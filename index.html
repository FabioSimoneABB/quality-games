<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quality Games Hub - DEBUG VERSION</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease-in-out;
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .debug-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            margin: 1rem 0;
        }
        .debug-line {
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }
        .debug-error { color: #ff6b6b; }
        .debug-success { color: #51cf66; }
        .debug-info { color: #74c0fc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <header class="w-full px-4 py-3 glass-panel sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goHome()">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-sky-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-award text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight leading-none text-white">Quality<span class="gradient-text">Games</span></h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">DEBUG MODE</p>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 max-w-4xl w-full mx-auto">

        <section id="view-home" class="w-full max-w-2xl space-y-6 py-4">
            <div class="text-center space-y-3">
                <h2 class="text-3xl font-extrabold text-white tracking-tight">🔧 Debug Quality Games</h2>
                <p class="text-slate-400">Testa la connessione a Supabase</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div onclick="app.testSupabaseConnection()" class="glass-panel p-6 rounded-2xl cursor-pointer group hover:border-indigo-500/50 transition-all">
                    <div class="space-y-2">
                        <i class="fa-solid fa-database text-indigo-400 text-2xl"></i>
                        <h3 class="text-lg font-bold text-white">Test Supabase</h3>
                        <p class="text-xs text-slate-400">Verifica connessione e tabelle</p>
                    </div>
                </div>

                <div onclick="app.createTestRoom()" class="glass-panel p-6 rounded-2xl cursor-pointer group hover:border-emerald-500/50 transition-all">
                    <div class="space-y-2">
                        <i class="fa-solid fa-plus text-emerald-400 text-2xl"></i>
                        <h3 class="text-lg font-bold text-white">Crea Stanza Test</h3>
                        <p class="text-xs text-slate-400">Crea una stanza per testare</p>
                    </div>
                </div>
            </div>

            <div id="debug-output" class="debug-box">
                <div class="debug-line debug-info">🟦 In attesa di test...</div>
            </div>

            <button onclick="app.goToHostMode()" class="w-full py-3 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white">
                Vai a Modalità HOST
            </button>
        </section>

        <section id="view-host-lobby" class="hidden w-full max-w-4xl space-y-6">
            <div class="flex flex-col gap-4">
                <div class="glass-panel p-6 rounded-2xl text-center">
                    <span class="text-xs font-bold text-slate-400 uppercase">Codice Stanza</span>
                    <div id="lobby-room-code-display" class="text-4xl font-black text-indigo-400 tracking-wider my-3 font-mono">---</div>
                </div>

                <div class="glass-panel p-4 rounded-2xl text-center">
                    <div id="lobby-players-count" class="text-2xl font-bold text-white">0 Giocatori</div>
                    <div id="lobby-players-list" class="mt-4 space-y-2 text-left text-sm"></div>
                </div>

                <button id="btn-start-game" onclick="app.hostStartGame()" disabled class="w-full py-3 rounded-xl font-bold bg-slate-800 text-slate-500 cursor-not-allowed">
                    Inizia il Gioco (0 pronti)
                </button>
            </div>

            <div id="debug-output2" class="debug-box">
                <div class="debug-line debug-info">🟦 Host lobby attivo</div>
            </div>
        </section>
    </main>

    <footer class="w-full px-4 py-3 text-center text-xs text-slate-500 border-t border-slate-800/50">
        Quality Games Debug &bull; Fabio Simone ABB
    </footer>

    <script>
        const SUPABASE_URL = 'https://qcwlyupyscvgieewyifk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MkwR5br0dO-hVHVlfTtWsw_fQI7lDEB';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        class DebugApp {
            constructor() {
                this.roomCode = null;
                this.logs = [];
            }

            log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : '🟦';
                this.logs.push({ timestamp, message, type, icon });
                this.renderLogs();
                console.log(`[${timestamp}] [${type.toUpperCase()}] ${message}`);
            }

            renderLogs() {
                const output = document.getElementById('debug-output');
                const output2 = document.getElementById('debug-output2');
                const html = this.logs.map((log, i) => `
                    <div class="debug-line debug-${log.type}">
                        <span class="text-slate-500">[${log.timestamp}]</span> 
                        ${log.icon} ${log.message}
                    </div>
                `).join('');
                if (output) output.innerHTML = html;
                if (output2) output2.innerHTML = html;
            }

            async testSupabaseConnection() {
                this.log('Test Supabase in corso...', 'info');
                
                try {
                    // Test 1: Connessione di base
                    const { data: users, error: usersError } = await supabase.auth.getUser();
                    this.log('Test auth.getUser(): ' + (usersError ? 'FALLITO' : 'OK (anonimo)'), usersError ? 'error' : 'success');

                    // Test 2: Leggi tabella rooms
                    const { data: roomsData, error: roomsError } = await supabase
                        .from('rooms')
                        .select('*')
                        .limit(1);
                    
                    if (roomsError) {
                        this.log(`Errore lettura rooms: ${roomsError.message}`, 'error');
                    } else {
                        this.log(`Tabella rooms OK (${roomsData.length} record)`, 'success');
                    }

                    // Test 3: Leggi tabella players
                    const { data: playersData, error: playersError } = await supabase
                        .from('players')
                        .select('*')
                        .limit(1);
                    
                    if (playersError) {
                        this.log(`Errore lettura players: ${playersError.message}`, 'error');
                    } else {
                        this.log(`Tabella players OK (${playersData.length} record)`, 'success');
                    }

                    // Test 4: Crea stanza test
                    const testId = 'test-' + Date.now();
                    const { error: insertError } = await supabase.from('rooms').insert([{
                        id: testId,
                        host_id: 'test-host',
                        game_state: 'LOBBY'
                    }]);

                    if (insertError) {
                        this.log(`Errore insert room: ${insertError.message}`, 'error');
                    } else {
                        this.log(`Insert room OK (ID: ${testId})`, 'success');

                        // Tenta di leggere la stanza appena creata
                        const { data: newRoom, error: readError } = await supabase
                            .from('rooms')
                            .select('*')
                            .eq('id', testId)
                            .single();

                        if (readError) {
                            this.log(`Errore lettura room appena creata: ${readError.message}`, 'error');
                        } else {
                            this.log(`Lettura room OK! Room: ${newRoom.id}`, 'success');
                        }
                    }

                } catch (err) {
                    this.log(`Eccezione: ${err.message}`, 'error');
                }
            }

            async createTestRoom() {
                this.log('Creazione stanza test...', 'info');
                
                try {
                    const randomId = 'qg-' + Math.floor(1000 + Math.random() * 9000);
                    this.roomCode = randomId;
                    
                    const { error } = await supabase.from('rooms').insert([{
                        id: randomId,
                        host_id: 'test-host-' + Date.now(),
                        game_state: 'LOBBY'
                    }]);

                    if (error) {
                        this.log(`Errore creazione stanza: ${error.message}`, 'error');
                        return;
                    }

                    this.log(`Stanza creata! Codice: ${randomId}`, 'success');
                    document.getElementById('lobby-room-code-display').innerText = randomId;

                    // Verifica che la stanza esista
                    const { data: room } = await supabase
                        .from('rooms')
                        .select('*')
                        .eq('id', randomId)
                        .single();

                    this.log(`Stanza verificata nel database: ${room.id}`, 'success');
                    
                    // Aggiungi giocatori test
                    const players = [
                        { id: 'p1-' + Date.now(), room_id: randomId, name: 'Giocatore 1', score: 0 },
                        { id: 'p2-' + Date.now(), room_id: randomId, name: 'Giocatore 2', score: 0 }
                    ];

                    const { error: insertError } = await supabase.from('players').insert(players);
                    
                    if (insertError) {
                        this.log(`Errore inserimento giocatori: ${insertError.message}`, 'error');
                    } else {
                        this.log(`${players.length} giocatori test aggiunti`, 'success');
                        this.updatePlayersList();
                    }

                } catch (err) {
                    this.log(`Eccezione: ${err.message}`, 'error');
                }
            }

            async updatePlayersList() {
                if (!this.roomCode) return;

                const { data: players, error } = await supabase
                    .from('players')
                    .select('*')
                    .eq('room_id', this.roomCode);

                if (error) {
                    this.log(`Errore lettura giocatori: ${error.message}`, 'error');
                    return;
                }

                document.getElementById('lobby-players-count').innerText = `${players.length} Giocatori`;
                document.getElementById('lobby-players-list').innerHTML = players.map(p => `
                    <div class="glass-card p-2 rounded">
                        <span class="text-emerald-400">${p.name}</span> - ${p.score} punti
                    </div>
                `).join('');

                this.log(`Caricati ${players.length} giocatori`, 'success');
            }

            goToHostMode() {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-host-lobby').classList.remove('hidden');
                this.createTestRoom();
                
                // Polling ogni 2 secondi
                setInterval(() => this.updatePlayersList(), 2000);
            }

            goHome() {
                location.reload();
            }

            hostStartGame() {
                alert('Test OK! Il gioco funziona.');
            }
        }

        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new DebugApp();
        });
    </script>
</body>
</html>
